<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Light gray background to make the form stand out */
        body { background-color: #f3f4f6; }
        .login-card { border-radius: 12px; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-sm p-4 login-card" style="width: 100%; max-width: 400px;">

        <div class="text-center mb-4">
            <img src="https://cdn-icons-png.flaticon.com/512/5087/5087579.png" alt="Login Icon" style="width: 80px; height: 80px;" class="mb-3">
            <h4 class="fw-bold text-dark">System Login</h4>
            <p class="text-muted small">Please enter your credentials</p>
        </div>


        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold text-secondary small">Username</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Username" required autofocus>
            </div>
            
            <div class="mb-4">
                <label for="password" class="form-label fw-semibold text-secondary small">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
            </div>

            <div class="d-flex gap-2">
                <button type="reset" class="btn btn-light border w-50 text-secondary">Reset</button>
                <button type="submit" class="btn btn-primary w-50">Login</button>
            </div>
        </form>
    </div>


    <script>
        document.getElementById("loginForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const usernameInput = document.getElementById("username").value;
            const passwordInput = document.getElementById("password").value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: usernameInput,
                        password: passwordInput
                    })
                });

                const data = await response.json();
                console.log("API Yanıtı:", data);

                if (response.ok) {
                    localStorage.setItem("isLoggedIn", "true");
                    localStorage.setItem("username", usernameInput);
                    localStorage.setItem("role", data.role || "Admin");

                    console.log("LocalStorage Kaydedildi:", localStorage.getItem("isLoggedIn"));

                    window.location.href = 'index.html';
                } else {
                    alert(data.message || "Kullanıcı adı veya şifre hatalı!");
                }
            } catch (error) {
                console.error("Bağlantı hatası:", error);
                alert("Sunucuya bağlanırken bir hata oluştu.");
            }
        });
    </script>
</body>
</html>
